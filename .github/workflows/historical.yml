name: Run Open-Meteo Weather Data Fetcher

on:
  workflow_dispatch: # Omogoča ročni zagon preko GitHub vmesnika

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Hitrejše nameščanje ob ponovnih zagonih

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openmeteo-requests pandas requests-cache retry-requests urllib3 numpy

      - name: Run Weather Script
        run: python pridobitev_historical_forecast.py # Spremenite 'main.py' v ime vaše Python datoteke, če je drugačno

      - name: Save output CSV files as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: weather-output-data
          path: output_hystorical_api/
          retention-days: 7